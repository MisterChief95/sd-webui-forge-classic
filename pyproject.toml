[project]
name = "sd-webui-forge-classic"
version = "0.1.0"
description = "Stable Diffusion WebUI Forge - Neo version"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "clean-fid==0.1.35",
    "diffusers",
    "diskcache==5.6.3",
    "einops==0.8.1",
    "facexlib==0.3.0",
    "fastapi==0.112.4",
    "gitpython==3.1.45",
    "gradio==4.44.0",
    "gradio_imageslider==0.0.20",
    "gradio_rangeslider==0.0.8",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==0.34.6",
    "inflection==0.5.1",
    "joblib",
    "jsonmerge",
    "kornia",
    "lark==1.2.2",
    "lightning==2.5.6",
    "loadimg==0.1.2",
    "numpy>2.0",
    "omegaconf==2.2.3",
    "open-clip-torch==3.0.0",
    "opencv-python==4.11.0.86",
    "peft==0.17.1",
    "piexif",
    "pillow<12.0.0",
    "pillow-heif",
    "pillow-jxl-plugin==1.3.6",
    "pip",
    "protobuf==4.25.8",
    "psutil",
    "pydantic==2.9.2",
    "pydantic-core==2.23.4",
    "resize-right==0.0.2",
    "safetensors",
    "scikit-image==0.25.2",
    "setuptools",
    "spandrel",
    "spandrel-extra-arches",
    "tomesd==0.1.3",
    "torch==2.9.1",
    "torchdiffeq==0.2.5",
    "torchsde==0.2.6",
    "tqdm",
    "triton-windows<3.6.0; platform_system=='Windows'",
    "triton>=2.0.0,<3.6.0; platform_system!='Windows'",
    "transformers==4.56.2",
]
requires-python = ">=3.11,<3.13"

[project.optional-dependencies]
torch = [
    "torch",
    "torchvision",
    "torchaudio",
]

xformers = [
    "xformers",
    "triton-windows; platform_system=='Windows'",
    "triton; platform_system!='Windows'",
]

dev = [
    "ruff",
    "black",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
default = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
xformers = { index = "pytorch-cu130" }
triton = { index = "pytorch-cu130" }

[tool.black]
line-length = 1024

[tool.ruff]
target-version = "py311"
exclude = ["extensions"]
lint.select = ["N805", "S307", "S102", "T", "W", "F"]
